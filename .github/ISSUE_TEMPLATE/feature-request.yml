name: Feature Request
description: Suggest a new feature or enhancement for Blender Editor Controls
labels: ["enhancement"]
body:
  - type: textarea
    id: problem-description
    attributes:
      label: Is your feature request related to a problem?
      description: Describe the friction or issue you are experiencing (e.g., "It takes too long to do X...").
    validations:
      required: false
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Feature
      description: A clear and concise description of what you want added or changed.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context / Mockups
      description: Add any other context, use-cases, or screenshots about the feature request here.
    validations:
      required: false